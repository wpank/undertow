[[task]]
id = "T1"
title = "Implement the sequencer core"
description = "Add `undertow/sequencer.h` and `core/src/sequencer.cpp` with `Step`, `Pattern`, `Scale`, `SeqEvent`, `Sequencer`, `defaultPattern()`, `inScale()`, note scheduling, probability, slide handling, mutate, evolve, and no-allocation processing. Assumption: the sequencer owns its pattern state entirely inside the core library and the engine will read it later through the API defined here."
role = "implementer"
status = "ready"
tier = "architectural"
max_loc = 300
files = [
    "core/include/undertow/sequencer.h",
    "core/src/sequencer.cpp",
]
depends_on = []
depends_on_plan = []
timeout_secs = 0
max_retries = 3
acceptance = [
    "AC1: `Step`, `Pattern`, `Scale`, `SeqEvent`, and the `Sequencer` API are declared in `core/include/undertow/sequencer.h`, and `defaultPattern()` matches the requested 16-step table.",
    "AC2: `inScale()` recognizes Chromatic, Minor, Phrygian, Dorian, and Minor Pentatonic degrees exactly as specified.",
    "AC3: `Sequencer::process()` schedules note-on/note-off events in time order with swing, gate, slide, probability, start/jump, and stop behavior matching the request.",
    "AC4: `Sequencer::mutate()` and evolve behavior are deterministic from seed and mutate count, keep gates/probabilities unchanged, and never allocate during `process`, `setParams`, `setPattern`, or `mutate`.",
]
sequence = 0
goal = "The project exposes a working 16-step sequencer API with default pattern, scales, processing, mutation, and evolve behavior."
non_goals = [
    "Do not edit engine wiring, engine headers, or any editor/state-save code.",
    "Do not modify `core/CMakeLists.txt`.",
    "Do not change any spec tests.",
]

[task.context]
symbols = [
    "Sequencer — the class to add in the new header",
    "defaultPattern — the factory pattern the engine should start from",
    "SeqEvent — the event type returned by process",
]
anti_patterns = [
    "Do NOT guess a different slide or probability rule than the spec request states.",
    "Do NOT add any heap allocation or locking inside sequencer processing or mutation.",
]
prior_failures = []

