[[task]]
id = "T2"
title = "Wire the sequencer into the engine and pattern handoff"
description = "Assumption: task T1 supplies a working Sequencer and defaultPattern. Extend undertow/engine.h and core/src/engine.cpp so Engine prepares the sequencer, starts with defaultPattern(), routes seq_on behavior and transport sync, updates meters().step, and adds thread-safe setPattern(pattern) and pattern() accessors using a no-lock, no-allocation handoff."
role = "implementer"
status = "ready"
tier = "integrative"
max_loc = 150
files = [
    "core/include/undertow/engine.h",
    "core/src/engine.cpp",
]
depends_on = ["T1"]
depends_on_plan = []
timeout_secs = 0
max_retries = 3
acceptance = [
    "AC1: tests/spec/p3/engine_test.cpp builds and the P3.10/P3.11 checks pass: with seq_on the engine plays sequencer notes on the host grid, meters().step follows, MIDI note-ons transpose the sequencer without directly playing the voice, seq_on off returns MIDI direct-play behavior, accented steps are louder, and slides glide without retriggering.",
    "AC2: tests/spec/p3/engine_test.cpp builds and the P3.12/P3.13 checks pass: seq_sync Internal uses seq_bpm, Host without a valid transport falls back to the internal clock, a host stop releases the note, setPattern and pattern() work from another thread without locks or tearing, and process performs no heap allocation during concurrent pattern updates.",
    "AC3: tests/spec/p3/engine_test.cpp builds and the P3.14/P3.15 checks pass: a prepared engine starts with defaultPattern(), defaultPattern matches the documented 16-step table, and the default patch with sequencer and evolve enabled renders within the CPU budget.",
]
sequence = 1
goal = "The engine owns the sequencer, drives it from transport, and exposes a lock-free pattern handoff that returns the newest pattern without tearing."
non_goals = [
    "Do not edit tests/spec/ or docs/ files.",
    "Do not change the sequencer algorithm beyond what is needed to wire it into the engine.",
    "Do not add editor-state persistence or phase-4 UI behavior.",
]

