[[task]]
id = "T1"
title = "Implement the standalone sequencer"
description = "Assumption: docs/specs/phase-3-sequencer.md is the authoritative contract for the sequencer API, timing, probabilities, mutation, evolve, and allocation-free processing. Add undertow/sequencer.h and core/src/sequencer.cpp, and rely on the existing source glob so the new file is built without editing core/CMakeLists.txt."
role = "implementer"
status = "ready"
tier = "architectural"
max_loc = 300
files = [
    "core/include/undertow/sequencer.h",
    "core/src/sequencer.cpp",
]
depends_on = []
depends_on_plan = []
timeout_secs = 0
max_retries = 3
acceptance = [
    "AC1: tests/spec/p3/sequencer_test.cpp builds and the P3.01/P3.02 checks pass: the sequencer starts on the 1/16 grid, seq_rate 0 makes 1/8 steps, seq_length only changes which pattern step plays, and swing delays odd steps.",
    "AC2: tests/spec/p3/sequencer_test.cpp builds and the P3.03/P3.04 checks pass: rests stay silent, accents reach note-ons, slides form legato note ordering, stopping ends the note at offset 0, loops and relocations retrigger correctly, and mid-step starts wait for the next step.",
    "AC3: tests/spec/p3/sequencer_test.cpp builds and the P3.05/P3.06 checks pass: probability is deterministic from seed and step number, repeated positions replay the same hits, different seeds differ, and note pitch is root plus transpose plus semitones.",
    "AC4: tests/spec/p3/sequencer_test.cpp builds and the P3.07/P3.08/P3.09 checks pass: the declared scales are correct, mutate(0) is a no-op, mutate(0.25) changes about a quarter of steps without touching gates or leaving the scale/octave, evolve mutates only at bar boundaries, and process/setParams/mutate/setPattern perform no heap allocation.",
]
sequence = 0
goal = "The core library provides a lock-free Sequencer with the documented steps, scales, default pattern, timing, mutation, and evolve behavior."
non_goals = [
    "Do not modify core/include/undertow/engine.h or core/src/engine.cpp in this task.",
    "Do not edit tests/spec/ or docs/ files.",
    "Do not change the existing audio engine voice or transport logic.",
]

[task.context]
symbols = ["Sequencer — the new class to implement"]
anti_patterns = [
    "Do NOT edit core/CMakeLists.txt; the existing source glob must pick up core/src/sequencer.cpp.",
    "Do NOT introduce heap allocations inside process, setParams, mutate, or setPattern.",
]
prior_failures = []

[[task.context.read_files]]
