acceptance = ["AC1: A held envelope whose sustain is changed 1 -> 0.3 -> 1 -> 0 -> 0.6 moves by at most 0.02 per sample, is within 0.005 of the new sustain after 50 ms, reaches the exact sustain value after 100 ms, and still releases to an exact 0."]
sequence = 0
goal = "Held-envelope sustain changes move smoothly, settle to the new sustain level, and still release to exact zero."
non_goals = [
